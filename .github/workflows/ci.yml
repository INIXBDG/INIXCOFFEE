name: CI Quality Checks

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  ci-quality-checks:
    name: Run Tests, Static Analysis & Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, zip, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env and Generate Application Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Code Style Check (Laravel Pint)
        run: vendor/bin/pint --test tests/Unit/EducationManagerKPIServiceTest.php

      - name: Run Unit & Feature Tests
        run: vendor/bin/phpunit tests/Unit/EducationManagerKPIServiceTest.php
